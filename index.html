<!doctype html>
<html lang="en">
<head>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#111827">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Workout Plan">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>12 Week Gym Workout</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#f3f4f6;color:#111827;line-height:1.4}
header{position:sticky;top:0;z-index:5;background:#111827;color:white;padding:14px 14px 10px;box-shadow:0 2px 10px #0002}
h1{font-size:21px;margin:0 0 4px}.sub{font-size:13px;color:#d1d5db}
.tabs{display:flex;gap:7px;overflow-x:auto;padding:10px 0 2px}.tabs button{border:0;border-radius:20px;padding:8px 12px;background:#374151;color:white;white-space:nowrap;font-weight:700}.tabs button.active{background:#fff;color:#111827}
main{max-width:700px;margin:auto;padding:12px}.day{display:none}.day.active{display:block}
.card{background:white;border-radius:14px;margin:10px 0;padding:14px;box-shadow:0 1px 5px #0001}
.card h2{font-size:17px;margin:0 0 10px}.tag{font-size:11px;padding:4px 8px;border-radius:12px;background:#e5e7eb;float:right}
.item{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #eee}.item:last-child{border-bottom:0}
.item input{width:21px;height:21px;flex:none}.name{font-weight:650;flex:1}.dose{font-size:13px;color:#4b5563;text-align:right}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:9px 5px;border-bottom:1px solid #eee}th{font-size:12px;color:#6b7280}
.timer{display:flex;gap:8px;align-items:center;justify-content:space-between;background:#f9fafb;border-radius:10px;padding:10px;margin-top:8px}.timer button{border:0;border-radius:9px;padding:8px 11px;background:#111827;color:white;font-weight:700}
.note{background:#fff7ed;border-left:4px solid #f97316;padding:10px;border-radius:8px;font-size:13px}.rest{background:#ecfdf5;border-left-color:#10b981}
.progress{height:7px;background:#e5e7eb;border-radius:8px;overflow:hidden}.bar{height:100%;width:0;background:#111827}
.small{font-size:12px;color:#6b7280}.complete{width:100%;border:0;border-radius:10px;padding:11px;background:#111827;color:white;font-weight:800;margin-top:10px}
</style>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:8px 0}.stat{background:#f9fafb;border-radius:10px;padding:9px;text-align:center}.stat b{display:block;font-size:17px}.stat span{font-size:10px;color:#6b7280}
.timer{display:flex;align-items:center;gap:6px;flex-wrap:wrap;background:#f9fafb;border-radius:10px;padding:10px}.timer strong{font-size:24px}.timer button{border:0;border-radius:8px;padding:8px 10px;background:#111827;color:white;font-weight:700}
</style></head>
<body>
<header>
<h1>🏋️ My 12-Week Workout Plan</h1>
<div class="sub">69 kg → 64 kg • Warm-up → Workout → HIIT → Cardio → Stretch</div>
<div class="tabs" id="tabs"></div>
</header>
<main id="app"></main>

<script>
const days=[
{key:"mon",label:"MON",title:"Chest + Triceps",warm:[
["Treadmill easy walk","5 min"],["Arm circles","20 forward + 20 backward"],["Shoulder rotations","15 each"],["Jumping jacks","30 sec"],["Push-ups","8–10"],["Light chest press","15 reps"]],
work:[["Bench press","3 × 8–12"],["Incline dumbbell press","3 × 10–12"],["Lower chest press","3 × 10–12"],["Pec fly","3 × 12–15"],["Triceps pushdown","3 × 10–15"],["Overhead dumbbell triceps extension","3 × 10–12"],["Dips","2 × 8–12"]],
hiit:["Jumping jacks","High knees","Mountain climbers","Prisoner squats","Butt kicks","Alternating lunges","Half burpees","Air skip rope"],cardio:["Treadmill","15–20 min"],stretch:[["Doorway chest stretch","30 sec × 2"],["Cross-body shoulder stretch","30 sec/arm"],["Overhead triceps stretch","30 sec/arm"],["Kneeling lat stretch","30 sec"],["Cobra pose","20–30 sec × 2"],["Child's pose","45 sec"]]},
{key:"tue",label:"TUE",title:"Back + Biceps",warm:[["Elliptical","5 min"],["Arm circles","20 + 20"],["Shoulder rotations","15 each"],["Light face pull","15"],["Light lat pulldown","15"]],work:[["Lat pulldown","3 × 8–12"],["T-Bar row","3 × 8–12"],["Back extension","3 × 12–15"],["Seated row machine","3 × 10–12"],["Single-arm dumbbell row","3 × 10/side"],["Dumbbell pullover","2 × 12–15"],["Face pull","3 × 12–15"],["Barbell biceps curl","3 × 8–12"],["Hammer curl","2 × 10–12"]],hiit:["High knees","Mountain climbers","Air skip rope","Butt kicks","Half burpees","Jumping jacks"],cardio:["Elliptical","15–20 min"],stretch:[["Kneeling lat stretch","30 sec"],["Cross-body shoulder stretch","30 sec/arm"],["Biceps wall stretch","30 sec/arm"],["Upper-back stretch","30 sec"],["Cobra pose","20–30 sec"],["Child's pose","45 sec"]]},
{key:"wed",label:"WED",title:"Legs",warm:[["Treadmill","5 min"],["Bodyweight squats","15"],["Walking lunges","10/leg"],["Leg swings","10/leg"],["Glute bridge","15"],["Calf raises","20"]],work:[["Squat","3 × 8–12"],["Smith machine squat","3 × 8–12"],["Straight-arm pullover","3 × 8–12"],["Walking/barbell lunges","3 × 10/leg"],["Leg extension","3 × 12–15"],["Leg curl","3 × 12–15"],["Kettlebell sumo squat","2 × 12–15"],["Standing calf raise","4 × 15–20"],["Glute bridge","2 × 15"]],hiit:[],cardio:["Treadmill","20–25 min"],stretch:[["Standing quadriceps stretch","30 sec/leg"],["Standing hamstring stretch","30 sec/leg"],["Calf wall stretch","30 sec/leg"],["Kneeling hip-flexor stretch","30 sec/leg"],["Figure-4/glute stretch","30 sec/leg"],["Cobra pose","20–30 sec"],["Child's pose","45 sec"]]},
{key:"thu",label:"THU",title:"Shoulders + Abs",warm:[["Elliptical","5 min"],["Arm circles","20 + 20"],["Shoulder rotations","15 each"],["Light lateral raise","15"],["Light shoulder press","10"]],work:[["Dumbbell shoulder press","3 × 8–12"],["Lateral raise","3 × 12–15"],["Front raise","2 × 12–15"],["Upright row","2 × 10–12"],["Shrugs","3 × 12–15"],["Leg raises","3 × 10–15"],["Ab machine","3 × 12–15"],["Russian twists","3 × 16–20"],["Plank","3 × 30–60 sec"],["Side plank","2 × 30–45 sec/side"]],hiit:["Jumping jacks","High knees","Mountain climbers","Shoulder plank","Butt kicks","Air skip rope"],cardio:["Elliptical","15–20 min"],stretch:[["Cross-body shoulder stretch","30 sec/arm"],["Overhead triceps stretch","30 sec/arm"],["Chest stretch","30 sec"],["Lat stretch","30 sec"],["Upper-back stretch","30 sec"],["Cobra pose","20–30 sec"],["Child's pose","45 sec"]]},
{key:"fri",label:"FRI",title:"Full Body",warm:[["Treadmill","5 min"],["Jumping jacks","30 sec"],["Bodyweight squats","15"],["Arm circles","20 + 20"],["Walking lunges","10/leg"],["Light push-ups","8–10"]],work:[["Goblet squat","3 × 12"],["Dumbbell bench press","3 × 10"],["Lat pulldown","3 × 10"],["Dumbbell Straight-arm pullover","3 × 10"],["Dumbbell shoulder press","2 × 10"],["Plate Loaded Mid Row","3 × 10–12"],["Preacher curl","3 × 10–12"],["Triceps pushdown","3 × 10–15"],["Walking lunges","2 × 10/leg"],["Plank","3 × 45 sec"]],hiit:["Jumping jacks","High knees","Prisoner squats","Mountain climbers","Alternating lunges","Air skip rope","Butt kicks","Half burpees"],cardio:["Treadmill","15–20 min"],stretch:[["Chest stretch","30 sec"],["Shoulder stretch","30 sec/arm"],["Triceps stretch","30 sec/arm"],["Quad stretch","30 sec/leg"],["Hamstring stretch","30 sec/leg"],["Calf stretch","30 sec/leg"],["Hip-flexor stretch","30 sec/leg"],["Cobra pose","20–30 sec"],["Child's pose","45 sec"]]},
{key:"sat",label:"SAT",title:"Cardio + HIIT",warm:[["Treadmill easy walk","5 min"],["Arm circles","1 min"],["Leg swings","1 min"],["Bodyweight squats","15"],["Walking lunges","10/leg"],["Easy jumping jacks","30 sec"]],work:[],hiit:["Jumping jacks","Air skip rope","High knees","Mountain climbers","Prisoner squats","Alternating lunges","Half burpees (30 sec)","Butt kicks"],cardio:[["Treadmill","20–30 min"],["Elliptical","15–20 min"]],stretch:[["Quad stretch","30 sec/leg"],["Hamstring stretch","30 sec/leg"],["Calf stretch","30 sec/leg"],["Hip-flexor stretch","30 sec/leg"],["Figure-4/glute stretch","30 sec/leg"],["Chest stretch","30 sec"],["Shoulder stretch","30 sec/arm"],["Cobra pose","20–30 sec"],["Child's pose","45 sec"]]}
];

function esc(s){return s.replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;")}
function checklist(items,prefix){return items.map((x,i)=>{let a=Array.isArray(x)?x:[x,""];return `<label class="item"><input type="checkbox" data-id="${prefix}-${i}"><span class="name">${esc(a[0])}</span><span class="dose">${esc(a[1])}</span></label>`}).join("")}
function dayHTML(d){
let warm=`<section class="card"><h2>🔥 Warm-up <span class="tag">10 min</span></h2>${checklist(d.warm,d.key+"-w")}</section>`;
let work=d.work.length?`<section class="card"><h2>💪 Workout <span class="tag">60–90 sec rest</span></h2>${checklist(d.work,d.key+"-x")}</section>`:`<section class="card"><h2>💪 Workout</h2><div class="note">Today is dedicated to conditioning. No strength workout.</div></section>`;
let hiit=d.hiit.length?`<section class="card"><h2>⚡ HIIT <span class="tag">40 sec / 20 sec</span></h2>${checklist(d.hiit.map(x=>[x,"40 sec"]),d.key+"-h")}<div class="small">Repeat as specified. Saturday = 2 rounds.</div></section>`:`<section class="card"><h2>⚡ HIIT</h2><div class="note rest">No HIIT today. Let your legs recover.</div></section>`;
let card=Array.isArray(d.cardio[0])?d.cardio:d.cardio.length?[d.cardio]:[];
let cardio=`<section class="card"><h2>🏃 Cardio</h2>${checklist(card,d.key+"-c")}</section>`;
let stretch=`<section class="card"><h2>🧘 Stretching <span class="tag">8–10 min</span></h2>${checklist(d.stretch,d.key+"-s")}<div class="note">Stretch gently. No bouncing and no painful range.</div></section>`;
return `<div class="day" id="${d.key}"><section class="card"><h2>${d.label} — ${d.title}</h2><div class="progress"><div class="bar" id="${d.key}-bar"></div></div><div class="small" id="${d.key}-count">0 completed</div></section>${warm}${work}${hiit}${cardio}${stretch}<button class="complete" onclick="clearDay('${d.key}')">Reset this day</button></div>`
}
document.getElementById("tabs").innerHTML=days.map((d,i)=>`<button class="${i===0?'active':''}" onclick="show('${d.key}',this)">${d.label}</button>`).join("");
document.getElementById("app").innerHTML=days.map(dayHTML).join("");
function show(k,b){document.querySelectorAll(".day").forEach(x=>x.classList.remove("active"));document.getElementById(k).classList.add("active");document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("active"));b.classList.add("active");localStorage.setItem("gymDay",k)}
function update(){document.querySelectorAll("input[data-id]").forEach(x=>{x.checked=localStorage.getItem(x.dataset.id)==="1";x.onchange=()=>{localStorage.setItem(x.dataset.id,x.checked?"1":"0");update()}});days.forEach(d=>{let xs=[...document.querySelectorAll(`#${d.key} input`)];let done=xs.filter(x=>x.checked).length;let pct=xs.length?done/xs.length*100:0;document.getElementById(d.key+"-bar").style.width=pct+"%";document.getElementById(d.key+"-count").textContent=`${done} / ${xs.length} completed`})}
function clearDay(k){document.querySelectorAll(`#${k} input`).forEach(x=>{x.checked=false;localStorage.removeItem(x.dataset.id)});update()}
update();
let saved=localStorage.getItem("gymDay"), idx=days.findIndex(d=>d.key===saved);if(idx>0)document.querySelectorAll(".tabs button")[idx].click();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js?v=4'));
}
</script>

<script>
/* Workout Plan v2 enhancements */
(function(){
  const BW=69;
  const oldUpdate=window.update;
  function enhance(){
    document.querySelectorAll('.day').forEach(day=>{
      // Keep a maximum of five stretches in every day.
      const stretchCard=[...day.querySelectorAll('.card')].find(c=>/Stretching/i.test(c.innerText));
      if(stretchCard){
        const rows=[...stretchCard.querySelectorAll('.item')];
        rows.slice(5).forEach(r=>r.remove());
      }
      // Add session estimate once.
      if(!day.querySelector('.session-stats')){
        const inputs=[...day.querySelectorAll('input')];
        const done=()=>{ const n=day.querySelectorAll('input:checked').length; return Math.round(n/Math.max(inputs.length,1)*100); };
        const stats=document.createElement('div'); stats.className='stats session-stats';
        stats.innerHTML='<div class="stat"><b>~75–95m</b><span>Typical session</span></div><div class="stat"><b>~400–650</b><span>Estimated kcal</span></div><div class="stat"><b id="p-'+day.id+'">0%</b><span>Completed</span></div>';
        const first=day.querySelector('.card'); first.insertBefore(stats, first.querySelector('.progress')||first.children[1]);
        inputs.forEach(i=>i.addEventListener('change',()=>{const p=document.getElementById('p-'+day.id);if(p)p.textContent=done()+'%'}));
      }
    });
  }
  enhance();
})();
</script>
<script>if('serviceWorker' in navigator) addEventListener('load',()=>navigator.serviceWorker.register('./sw.js?v=4'));</script>
</body>
</html>
